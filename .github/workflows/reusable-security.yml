name: Sankofa security
on: { workflow_call: {} }
jobs:
  security:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan commits for secrets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          commit_range=HEAD
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            commit_range="$BASE_SHA..HEAD"
          fi

          # Official Gitleaks v8.30.1 image pinned by manifest digest.
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact --log-opts="$commit_range" /repo
      - name: Audit npm dependencies
        if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
